name: Publish package feed

on:
  push:
    branches: [main]
    paths:
      - 'repository/**'
      - 'tools/export-public-feed.py'
      - '.github/workflows/feed-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and export compiled Home Assistant package
        run: python3 tools/export-public-feed.py --no-build --output dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages/cs-extensions
      # GitHub lists a new artifact a little after its upload, at times later
      # than deploy-pages looks for it, which then finds none and fails.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 0 60); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "listed after $((i * 5)) s"; exit 0; fi
            sleep 5
          done
          echo "::error::The github-pages artifact is still not listed after 5 minutes."
          exit 1
      - name: Publish feed
        id: deployment
        uses: actions/deploy-pages@v4
