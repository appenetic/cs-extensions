name: Publish package feed

on:
  push:
    branches: [main]
    paths:
      - 'repository/**'
      - 'tools/export-public-feed.py'
      - '.github/workflows/feed-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and export compiled Home Assistant package
        run: python3 tools/export-public-feed.py --no-build --output dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages/cs-extensions
      - name: Publish feed
        id: deployment
        uses: actions/deploy-pages@v4
