{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "app.js"}}" defer></script>{{end}}

{{define "adminbar"}}<header class="topbar"><div class="wrap topbar-in">
<a class="brand" href="/admin">{{icon}}<span>Sammel-Repo</span></a>
<nav class="tabs" aria-label="Bereiche">
<a href="/admin"{{if eq .Page "uebersicht"}} aria-current="page"{{end}}>Übersicht</a>
<a href="/admin/statistik"{{if eq .Page "statistik"}} aria-current="page"{{end}}>Statistik</a>
<a href="/" target="_blank" rel="noopener">Öffentliche Seite ↗</a>
</nav>
<form class="who" method="post" action="/admin/abmelden"><input type="hidden" name="csrf" value="{{.CSRF}}"><span>{{.User}}</span><button class="link" type="submit">Abmelden</button></form>
</div></header>{{end}}

{{define "ranks"}}{{if .}}<ol class="ranks">{{range .}}<li><span class="rank-label">{{with .Flag}}<span class="flag" aria-hidden="true">{{.}}</span>{{end}}<span class="rank-name">{{.Label}}</span></span><span class="rank-track" aria-hidden="true"><span class="rank-bar {{.Width}}"></span></span><span class="rank-value">{{.N}}<span class="pct">{{.Pct}} %</span></span></li>{{end}}</ol>{{else}}<p class="empty">Noch keine Daten.</p>{{end}}{{end}}
